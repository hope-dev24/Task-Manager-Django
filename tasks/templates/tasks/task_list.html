{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="{% static 'tasks/style.css' %}">
    </head>
    <body>
        <h1>Task Manager</h1>
        {% for task in tasks %}
             <p>{{task.title}} - {% if task.completed %}Done{% else %}Not Done{% endif %}
                <a href="{% url 'toggle_task' task.id %}">Toggle</a>
                <a href="{% url 'delete_task' task.id %}">Delete</a>
             </p>
        {% endfor %}  
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="New Task...">
            <button type="submit">Add Task</button>
        </form>    
    </body>
</html>
